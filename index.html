<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idiomai - Plataforma Gamer de Idiomas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin: 20px 0; }
        header h1 { font-size: 2.2rem; color: #38bdf8; text-shadow: 0 0 15px rgba(56,189,248,0.4); }
        header p { font-size: 0.9rem; color: #94a3b8; margin-top: 5px; }

        .hidden { display: none !important; }
        .screen { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }

        /* MENU HOME */
        .score-display { background: #1e293b; padding: 10px 20px; border-radius: 50px; font-weight: bold; margin-bottom: 15px; border: 1px solid #334155; color: #f59e0b; }
        .grid-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 15px; }
        .group-btn { border: none; padding: 20px 10px; border-radius: 15px; font-weight: bold; color: #0f172a; cursor: pointer; font-size: 0.9rem; transition: transform 0.2s; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .group-btn:active { transform: scale(0.95); }
        .btn-ninja { grid-column: span 2; background: linear-gradient(45deg, #ef4444, #b91c1c); color: white; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 1px; box-shadow: 0 0 15px rgba(239,68,68,0.5); }

        /* FLASHCARDS SCREEN */
        .flashcard-container { width: 100%; height: 260px; perspective: 1000px; margin: 20px 0; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s; border-radius: 20px; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .front { background: white; color: #0f172a; }
        .back { transform: rotateY(180deg); background: #1e293b; color: white; border: 3px solid #38bdf8; }
        .card-img { width: 100%; height: 70%; object-fit: cover; border-radius: 12px; margin-bottom: 10px; background: #e2e8f0; }
        .word-txt { font-size: 1.8rem; font-weight: bold; text-transform: capitalize; text-align: center; }

        /* ALTERNATIVAS */
        .options-container { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 20px; }
        .option-btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s; }
        .option-btn:active { transform: scale(0.98); }
        .correct { background: #10b981 !important; border-color: #059669 !important; color: white; }
        .wrong { background: #ef4444 !important; border-color: #dc2626 !important; color: white; }
        .nav-btn { background: #334155; border: none; color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; }

        /* JOGO NINJA */
        #game-canvas { width: 100%; height: 400px; background: #020617; border: 2px dashed #ef4444; border-radius: 20px; position: relative; overflow: hidden; margin-top: 15px; }
        .falling-word { position: absolute; background: #ef4444; color: white; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; white-space: nowrap; animation: fall linear forwards; box-shadow: 0 0 8px rgba(239,68,68,0.6); }
        @keyframes fall { 0% { top: -40px; } 100% { top: 410px; } }
    </style>
</head>
<body>

    <header onclick="initAudioAndPlayYo()">
        <h1 id="main-title">WELCOME TO IDIOMAI</h1>
        <p id="main-subtitle">Clique aqui ou em qualquer botão para ativar os sons! 🔊</p>
    </header>

    <div class="score-display">PONTOS: <span id="global-score">0</span></div>

    <!-- TELA 1: HOME -->
    <div id="screen-home" class="screen">
        <div class="grid-groups">
            <button class="group-btn btn-ninja" onclick="startNinjaGame()">⚔️ Jogo Word Ninja</button>
            <button class="group-btn" style="background: #fef08a;" onclick="startGroup('utensilios')">🏠 Utensílios</button>
            <button class="group-btn" style="background: #fed7aa;" onclick="startGroup('profissoes')">💼 Profissões</button>
            <button class="group-btn" style="background: #bfdbfe;" onclick="startGroup('escola')">🎒 Escola</button>
            <button class="group-btn" style="background: #fca5a5;" onclick="startGroup('hospital')">🏥 Hospital</button>
            <button class="group-btn" style="background: #f472b6;" onclick="startGroup('halloween')">🎃 Halloween</button>
            <button class="group-btn" style="background: #e2e8f0;" onclick="startGroup('construcao')">🏗️ Construção</button>
            <button class="group-btn" style="background: #bbf7d0;" onclick="startGroup('animais')">🦁 Animais</button>
            <button class="group-btn" style="background: #ddd6fe;" onclick="startGroup('transportes')">🚗 Transportes</button>
        </div>
    </div>

    <!-- TELA 2: FLASHCARDS + QUIZ -->
    <div id="screen-cards" class="screen hidden">
        <button class="nav-btn" onclick="goToHome()" style="align-self: flex-start;">◀ Voltar ao Menu</button>
        <div class="flashcard-container">
            <div class="flashcard" id="html-card" onclick="flipCard()">
                <div class="face front" id="card-front-face">
                    <img src="" id="img-asset" class="card-img" alt="Vocabulário">
                    <div class="word-txt" id="txt-portugues">Carregando...</div>
                </div>
                <div class="face back">
                    <div class="word-txt" id="txt-ingles" style="color: #38bdf8;">...</div>
                    <p style="margin-top:10px; font-size:0.8rem; color:#94a3b8;">Toque para ver a dica</p>
                </div>
            </div>
        </div>
        <div id="quiz-alert-text" style="margin-bottom: 10px; font-size: 0.9rem; color: #f59e0b; font-weight: bold; text-align: center;">Qual é a tradução correta? Se errar, volta do início! Cuidado! ⚠️</div>
        <div class="options-container" id="quiz-options"></div>
    </div>

    <!-- TELA 3: JOGO DO NINJA -->
    <div id="screen-ninja" class="screen hidden">
        <div style="display:flex; justify-content: space-between; width:100%;">
            <button class="nav-btn" onclick="stopNinjaGame()">🛑 Sair do Jogo</button>
            <div style="font-weight:bold; color:#ef4444;">NÍVEL: <span id="ninja-level">1</span></div>
        </div>
        <p style="font-size:0.8rem; color:#94a3b8; margin-top:10px; text-align:center;">Toque rápido nas palavras vermelhas in inglês para cortá-las com sua espada ninja!</p>
        <div id="game-canvas"></div>
    </div>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 🔊 SOM: Entrada "YO!"
        function playYoSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function initAudioAndPlayYo() {
            playYoSound();
            document.getElementById('main-subtitle').textContent = "Aprenda vocabulários jogando e acumulando pontos!";
        }

        // ⚔️ SOM: Barulho de Corte da Espada Ninja
        function playSlashSound() {
            if (!audioCtx) initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // 🥋 SOM: Grito do Ninja Kiai
        function playNinjaScream() {
            if (!audioCtx) initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(320, audioCtx.currentTime + 0.1);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.45);
        }
