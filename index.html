<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idiomai - Flashcards Visuais de Inglês</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: white; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1rem; opacity: 0.9; margin-top: 5px; }
        
        .flashcard-container { width: 340px; height: 450px; perspective: 1000px; cursor: pointer; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 15px 35px rgba(0,0,0,0.4); border-radius: 20px; }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 25px; background: white; color: #333; }
        .card-back { transform: rotateY(180deg); background: #f8f9fa; border: 4px solid #4a90e2; }
        
        .image-box { width: 100%; height: 200px; border-radius: 12px; overflow: hidden; background: #e0e0e0; margin-bottom: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .word-text { font-size: 2.2rem; font-weight: 800; color: #1e3c72; text-align: center; word-break: break-word; margin: auto 0; }
        .translation-text { font-size: 1.8rem; font-weight: 700; color: #e65100; text-align: center; margin-bottom: 10px; }
        .example-text { font-size: 1rem; color: #555; text-align: center; font-style: italic; line-height: 1.4; background: #fff3e0; padding: 10px; border-radius: 8px; width: 100%; }
        
        .hint-tap { font-size: 0.8rem; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
        
        .controls { display: flex; gap: 20px; margin-top: 35px; width: 340px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-prev { background: #e0e0e0; color: #333; }
        .btn-next { background: #ff9800; color: white; }
        button:active { transform: scale(0.98); }
        
        .progress { margin-top: 15px; font-size: 0.9rem; opacity: 0.8; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <header>
        <h1>Idiomai</h1>
        <p>Toque no cartão para ver a tradução</p>
    </header>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="card">
            <!-- FRENTE DO CARTÃO (Inglês + Imagem) -->
            <div class="card-face card-front">
                <div class="image-box">
                    <img id="card-image" src="" alt="Ilustração da palavra">
                </div>
                <div class="word-text" id="card-word">Loading...</div>
                <div class="hint-tap">💡 Toque para revelar</div>
            </div>
            <!-- VERSO DO CARTÃO (Português + Exemplo) -->
            <div class="card-face card-back">
                <div style="font-size: 0.9rem; color: #777; text-transform: uppercase;">Tradução</div>
                <div class="translation-text" id="card-translation">...</div>
                <div class="example-text" id="card-example">...</div>
                <div class="hint-tap">🔄 Toque para voltar</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-prev" onclick="prevCard(event)">◀ Voltar</button>
        <button class="btn-next" onclick="nextCard(event)">Avançar ▶</button>
    </div>

    <div class="progress" id="card-progress">Cartão 1 de 1</div>

    <script>
        const flashcards = [
            { word: "Coffee", translation: "Café", example: "I drink hot coffee every morning." },
            { word: "Beach", translation: "Praia", example: "We love to walk on the sunny beach." },
            { word: "Bookshelf", translation: "Prateleira de livros", example: "The bookshelf is full of interesting stories." },
            { word: "Cat", translation: "Gato", example: "The sleeping cat looks so cute." },
            { word: "Rain", translation: "Chuva", example: "Don't forget your umbrella, it's going to rain." },
            { word: "Airplane", translation: "Avião", example: "The airplane is flying high above the clouds." }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('card');

        function updateCard() {
            cardElement.classList.remove('flipped');
            
            setTimeout(() => {
                const currentData = flashcards[currentIndex];
                document.getElementById('card-word').innerText = currentData.word;
                document.getElementById('card-translation').innerText = currentData.translation;
                document.getElementById('card-example').innerText = currentData.example;
                
                const fallbackImages = [
                    "https://unsplash.com",
                    "https://unsplash.com",
                    "https://unsplash.com",
                    "https://unsplash.com",
                    "https://unsplash.com",
                    "https://unsplash.com"
                ];
                document.getElementById('card-image').src = fallbackImages[currentIndex];

                document.getElementById('card-progress').innerText = `Cartão ${currentIndex + 1} de ${flashcards.length}`;
            }, 200);
        }

        function flipCard() {
            cardElement.classList.toggle('flipped');
        }

        function nextCard(event) {
            event.stopPropagation();
            currentIndex = (currentIndex + 1) % flashcards.length;
            updateCard();
        }

        function prevCard(event) {
            event.stopPropagation();
            currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
